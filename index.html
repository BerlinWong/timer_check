<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Duration Calculator | Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@300;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #666666;
            --transition: 0.3s cubic-bezier(0.2, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Minimal Header --- */
        .sync-info {
            position: absolute;
            top: 2rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* --- Logic Grid --- */
        .calculator-engine {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 3rem;
        }

        .time-panel {
            background: var(--surface);
            border-radius: 40px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            transition: var(--transition);
        }

        .panel-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* --- Scroller Design --- */
        .scroller-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        .wheel-wrap {
            position: relative;
            height: 160px;
            width: 90px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            cursor: pointer;
            mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
        }

        .wheel-wrap::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 80px;
            /* Large touch area */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 400;
            color: var(--text-dim);
            scroll-snap-align: center;
            transition: color 0.1s;
            font-family: 'Inter', sans-serif;
        }

        .wheel-item.active {
            color: var(--text-main);
            font-weight: 900;
        }

        .symbol-colon {
            font-size: 2rem;
            color: var(--text-dim);
            font-weight: 300;
        }

        /* --- Result Section --- */
        .result-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .result-label {
            font-size: 1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        #big-duration {
            font-size: clamp(5rem, 18vw, 12rem);
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 0.9;
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow);
        }

        #text-duration {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 300;
            opacity: 0.8;
        }

        /* --- Fast Scrub Slider --- */
        .fast-scrub {
            width: 100%;
            height: 8px;
            background: #222;
            border-radius: 4px;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .fast-scrub::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            background: var(--text-main);
            border-radius: 50%;
            border: 4px solid var(--bg);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 600px) {
            .app-container {
                gap: 1.5rem;
                padding: 1rem;
                margin-top: 2rem;
            }

            .calculator-engine {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .time-panel {
                padding: 1.5rem;
                border-radius: 24px;
            }

            .wheel-wrap {
                height: 120px;
                width: 70px;
            }

            .wheel-item {
                height: 60px;
                font-size: 2.2rem;
            }

            #big-duration {
                font-size: 5rem;
                letter-spacing: -2px;
            }

            .arrow-divider {
                transform: rotate(90deg);
                margin: -10px 0;
                font-size: 1.5rem;
                color: var(--text-dim);
            }
        }

        .arrow-divider {
            font-size: 2rem;
            color: var(--text-dim);
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="sync-info" id="clock-live">00:00:00</div>

    <div class="app-container">
        <!-- Input Grid -->
        <div class="calculator-engine">
            <!-- Start -->
            <div class="time-panel">
                <div class="panel-label">Start Time</div>
                <div class="scroller-group">
                    <div class="wheel-wrap" id="s-h-wheel"></div>
                    <div class="symbol-colon">:</div>
                    <div class="wheel-wrap" id="s-m-wheel"></div>
                </div>
                <input type="range" min="0" max="1439" value="540" class="fast-scrub" id="s-slider">
            </div>

            <div class="arrow-divider">→</div>

            <!-- End -->
            <div class="time-panel">
                <div class="panel-label">End Time</div>
                <div class="scroller-group">
                    <div class="wheel-wrap" id="e-h-wheel"></div>
                    <div class="symbol-colon">:</div>
                    <div class="wheel-wrap" id="e-m-wheel"></div>
                </div>
                <input type="range" min="0" max="1439" value="1020" class="fast-scrub" id="e-slider">
            </div>
        </div>

        <!-- Result -->
        <div class="result-stage">
            <div class="result-label">Duration</div>
            <div id="big-duration">08:00</div>
            <div id="text-duration">8 hours 0 minutes</div>
        </div>
    </div>

    <script>
        const state = {
            start: { h: 9, m: 0 },
            end: { h: 17, m: 0 }
        };

        const elements = {
            sh: document.getElementById('s-h-wheel'),
            sm: document.getElementById('s-m-wheel'),
            eh: document.getElementById('e-h-wheel'),
            em: document.getElementById('e-m-wheel'),
            ss: document.getElementById('s-slider'),
            es: document.getElementById('e-slider'),
            big: document.getElementById('big-duration'),
            txt: document.getElementById('text-duration'),
            live: document.getElementById('clock-live')
        };

        function initWheels() {
            const createHTML = (count) => {
                let html = '<div class="wheel-item"></div>'; // Top spacer
                for (let i = 0; i < count; i++) {
                    html += `<div class="wheel-item" data-val="${i}">${i.toString().padStart(2, '0')}</div>`;
                }
                html += '<div class="wheel-item"></div>'; // Bottom spacer
                return html;
            };

            elements.sh.innerHTML = createHTML(24);
            elements.eh.innerHTML = createHTML(24);
            elements.sm.innerHTML = createHTML(60);
            elements.em.innerHTML = createHTML(60);
        }

        function calculate() {
            let sTotal = state.start.h * 60 + state.start.m;
            let eTotal = state.end.h * 60 + state.end.m;
            let diff = eTotal - sTotal;
            if (diff < 0) diff += 1440;

            const h = Math.floor(diff / 60);
            const m = diff % 60;

            elements.big.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            elements.txt.textContent = `${h}h ${m}m duration`;

            elements.ss.value = sTotal;
            elements.es.value = eTotal;
        }

        function scrollToValue(wheel, val, behavior = 'smooth') {
            const item = wheel.querySelector(`.wheel-item[data-val="${val}"]`);
            if (item) {
                wheel.scrollTo({
                    top: item.offsetTop - wheel.offsetTop - (wheel.clientHeight / 2) + (item.clientHeight / 2),
                    behavior: behavior
                });
            }
        }

        function setupScroll(wheel, key, subkey) {
            let isTicking = false;
            wheel.addEventListener('scroll', () => {
                if (!isTicking) {
                    window.requestAnimationFrame(() => {
                        const center = wheel.scrollTop + wheel.clientHeight / 2;
                        const items = wheel.querySelectorAll('.wheel-item[data-val]');
                        let closest = null;
                        let minDist = Infinity;

                        items.forEach(item => {
                            const itemCenter = item.offsetTop - wheel.offsetTop + item.clientHeight / 2;
                            const dist = Math.abs(center - itemCenter);
                            if (dist < minDist) {
                                minDist = dist;
                                closest = item;
                            }
                        });

                        if (closest) {
                            items.forEach(i => i.classList.remove('active'));
                            closest.classList.add('active');
                            const newVal = parseInt(closest.getAttribute('data-val'));
                            if (state[key][subkey] !== newVal) {
                                state[key][subkey] = newVal;
                                calculate();
                            }
                        }
                        isTicking = false;
                    });
                    isTicking = true;
                }
            }, { passive: true });
        }

        // Slider Listeners
        elements.ss.addEventListener('input', (e) => {
            const v = parseInt(e.target.value);
            state.start.h = Math.floor(v / 60);
            state.start.m = v % 60;
            scrollToValue(elements.sh, state.start.h, 'auto');
            scrollToValue(elements.sm, state.start.m, 'auto');
            calculate();
        });

        elements.es.addEventListener('input', (e) => {
            const v = parseInt(e.target.value);
            state.end.h = Math.floor(v / 60);
            state.end.m = v % 60;
            scrollToValue(elements.eh, state.end.h, 'auto');
            scrollToValue(elements.em, state.end.h, 'auto'); // typo fix eh to em
            calculate();
        });

        // Live Clock
        setInterval(() => {
            elements.live.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        }, 1000);

        // Bootstrap
        initWheels();
        setupScroll(elements.sh, 'start', 'h');
        setupScroll(elements.sm, 'start', 'm');
        setupScroll(elements.eh, 'end', 'h');
        setupScroll(elements.em, 'end', 'm');

        setTimeout(() => {
            scrollToValue(elements.sh, state.start.h, 'auto');
            scrollToValue(elements.sm, state.start.m, 'auto');
            scrollToValue(elements.eh, state.end.h, 'auto');
            scrollToValue(elements.em, state.end.m, 'auto');
            calculate();
        }, 300);

    </script>
</body>

</html>
